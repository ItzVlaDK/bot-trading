name: bot-trading

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "teste, relatorio ou normal"
        required: false
        default: "teste"

permissions:
  contents: write

concurrency:
  group: bot-trading
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Correr o bot
        run: python bot.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MODO: ${{ github.event.inputs.modo || 'normal' }}

      - name: Guardar o estado
        run: |
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/state.json"
          for tentativa in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/state.json" state.json
            git add state.json
            if git diff --cached --quiet; then
              echo "Estado sem alterações."
              exit 0
            fi
            git commit -m "estado do bot [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push recusado, nova tentativa..."
            sleep 5
          done
          echo "Não foi possível guardar o estado."
          exit 1
